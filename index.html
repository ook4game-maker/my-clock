<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7-Segment Digital Clock</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clock">
    
    <style>
        /* บังคับโหลดฟอนต์ด้วยรูปแบบ TTF เพื่อให้ iOS 9 รองรับแน่นอน */
        @font-face {
            font-family: 'Orbitron-iOS9';
            src: url('https://gstatic.com') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #d1d5db; /* สีขาวเทาหลัก */
            font-family: 'Orbitron-iOS9', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050505;
            padding: 30px 40px;
            border-radius: 20px;
            border: 2px solid #1f2937;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.03);
            width: 90vw; /* ล็อคความกว้างให้พอดีกับจอ iPad */
        }

        .time-display {
            font-size: 14vw; /* เพิ่มขนาดตัวเลขให้เต็มหน้าจอ iPad mini มากขึ้น */
            letter-spacing: 2px;
            text-shadow: 0 0 25px rgba(209, 213, 219, 0.5); /* เอฟเฟกต์เรืองแสง */
            font-weight: 700;
            white-space: nowrap;
        }

        .colon {
            animation: blink 1s infinite;
            padding: 0 5px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.1; }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div class="time-display">
            <span id="hours">00</span><span class="colon">:</span><span id="minutes">00</span><span class="colon">:</span><span id="seconds">00</span>
        </div>
    </div>

    <script>
        function updateClock() {
            var now = new Date();
            
            var h = now.getHours();
            var m = now.getMinutes();
            var s = now.getSeconds();
            
            var hours   = (h < 10) ? '0' + h : h;
            var minutes = (m < 10) ? '0' + m : m;
            var seconds = (s < 10) ? '0' + s : s;
            
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
